<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演出プレビュー｜かめはめ波・元気玉</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101c;color:#e3edf7;font:14px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:21px;margin:0 0 6px}p{color:#a5b7c9;margin:8px 0 16px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}button,select,a{font:inherit;color:inherit;background:#172739;border:1px solid #3b5269;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffd463}#stage{position:relative;background:radial-gradient(ellipse at 50% 30%,#263a4d,#111e2d 65%,#0a1420);border:1px solid #30435a;border-radius:12px;overflow:hidden;height:min(66vh,600px);min-height:340px}canvas{width:100%;height:100%;display:block}.timeline{display:flex;align-items:center;gap:10px}input{flex:1;min-width:80px;accent-color:#ffd463}output{font-variant-numeric:tabular-nums}#status{font-size:12px;color:#a5b7c9;margin-top:10px}a{display:inline-block;text-decoration:none}.note{font-size:12px}label{display:flex;gap:6px;align-items:center}#state{position:absolute;left:14px;top:12px;pointer-events:none;color:#d0deeb}#figure{position:absolute;inset:0;pointer-events:none}#effects{position:absolute;inset:0}
</style></head><body><main><h1>演出プレビュー</h1><p>カメラなしで、ためる・発射・余韻を確認できます。</p>
<div class="controls"><select id="kind" aria-label="技"><option value="kame">かめはめ波</option><option value="genki">元気玉</option></select><select id="direction" aria-label="方向"><option value="forward">前方</option><option value="right">右へ</option><option value="left">左へ</option></select><select id="people" aria-label="人数"><option value="1">1人</option><option value="4">4人</option></select><label><input type="checkbox" id="reduced">動きを抑える</label></div>
<div id="stage"><canvas id="figure"></canvas><canvas id="effects"></canvas><span id="state">ためる</span></div>
<div class="controls"><button id="play">再生</button><button data-time="2.7">ためる</button><button data-time="3.45">発射</button><button data-time="4.18">余韻</button><button id="reset">最初から</button></div>
<div class="timeline"><label for="time">時間</label><input id="time" type="range" min="0" max="4.8" step="0.01" value="2.7"><output id="clock">2.70 s</output></div>
<div id="status" role="status">準備中</div><p class="note">合成位置による描画確認です。カメラ認識・実機の速度・音声の確認とは異なります。</p><a href="./">ゲームへ</a>
<script type="module" src="./effects-preview.js"></script></main></body></html>
